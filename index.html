<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Workout Tracker</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#00F0FF', // Neon Cyan
                            500: '#00FFA3', // Neon Emerald
                        },
                        surface: {
                            100: 'rgba(255, 255, 255, 0.02)',
                            200: 'rgba(255, 255, 255, 0.05)',
                            300: 'rgba(255, 255, 255, 0.1)',
                        },
                        app: '#05070A' // Deep void black
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #05070A;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .glow-completed {
            box-shadow: 0 0 30px rgba(0, 255, 163, 0.1), inset 0 0 20px rgba(0, 255, 163, 0.05);
            border-color: rgba(0, 255, 163, 0.2);
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
            animation: pulse 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.1) translate(30px, -30px); opacity: 0.4; }
        }
        
        .exercise-done-text {
            text-decoration: line-through;
            opacity: 0.4;
        }

        .input-glass {
            background: rgba(0,0,0,0.3);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEY = 'elite_fitness_protocol_v3';
        const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        const initialSeedData = {
            "Thursday": {
                isRest: false,
                groups: [
                    { name: "Chest", exercises: [
                        { name: "Chest press", weight: "100", reps: "10-12", sets: [false, false, false] },
                        { name: "Fly", weight: "90", reps: "10-12", sets: [false, false, false] },
                        { name: "MTS chest press", weight: "100", reps: "10-12", sets: [false, false, false] }
                    ]},
                    { name: "Biceps", exercises: [
                        { name: "Biceps curl", weight: "60", reps: "8-10", sets: [false, false, false] },
                        { name: "Arm curl", weight: "50", reps: "10-12", sets: [false, false, false] }
                    ]},
                    { name: "Abs", exercises: [
                        { name: "Rotary torso", weight: "200", reps: "12-10-8", sets: [false, false, false] }
                    ]}
                ]
            },
            "Friday": { isRest: true, groups: [] },
            "Saturday": {
                isRest: false,
                groups: [
                    { name: "Shoulder", exercises: [
                        { name: "Reverse fly", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Shoulder press", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Triceps", exercises: [
                        { name: "Triceps press", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Cable", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Abs", exercises: [
                        { name: "Rotary torso", weight: "200", reps: "12-10-8", sets: [false, false, false] },
                        { name: "Abdominal machine", weight: "0", reps: "10", sets: [false, false, false] }
                    ]}
                ]
            },
            "Sunday": {
                isRest: false,
                groups: [
                    { name: "Back", exercises: [
                        { name: "Back extension", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "MTS front pull down", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Lat", exercises: [
                        { name: "Sitter row", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Lat pull down", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Abs", exercises: [
                        { name: "Rotary torso", weight: "200", reps: "12-10-8", sets: [false, false, false] }
                    ]}
                ]
            },
            "Monday": { isRest: true, groups: [] },
            "Tuesday": {
                isRest: false,
                groups: [
                    { name: "Leg", exercises: [
                        { name: "Lex extension", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Seated leg curl", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Leg press", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Calf extension", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Forearms", exercises: [
                        { name: "Dumbbell exercises", weight: "0", reps: "10", sets: [false, false, false] },
                        { name: "Dumbbell reverse", weight: "0", reps: "10", sets: [false, false, false] }
                    ]},
                    { name: "Abs", exercises: [
                        { name: "Rotary torso", weight: "200", reps: "12-10-8", sets: [false, false, false] },
                        { name: "Abdominal crunch machine", weight: "0", reps: "10", sets: [false, false, false] }
                    ]}
                ]
            },
            "Wednesday": { isRest: true, groups: [] }
        };

        const getMuscleIcon = (muscleName) => {
            const name = muscleName.toLowerCase();
            if (name.includes('chest')) return 'ph-barbell';
            if (name.includes('bicep') || name.includes('tricep') || name.includes('arm')) return 'ph-hand-fist';
            if (name.includes('abs') || name.includes('abdominal')) return 'ph-squares-four';
            if (name.includes('shoulder')) return 'ph-triangle';
            if (name.includes('back') || name.includes('lat')) return 'ph-arrow-fat-lines-up';
            if (name.includes('leg') || name.includes('calf')) return 'ph-sneaker';
            return 'ph-activity';
        };

        const getExerciseIcon = (exerciseName) => {
            const name = exerciseName.toLowerCase();
            if (name.includes('cable')) return 'ph-link';
            if (name.includes('machine')) return 'ph-engine';
            if (name.includes('dumbbell')) return 'ph-barbell';
            if (name.includes('curl')) return 'ph-arrows-clockwise';
            if (name.includes('press')) return 'ph-arrows-out-line-vertical';
            if (name.includes('fly')) return 'ph-bird';
            if (name.includes('extension')) return 'ph-arrows-out';
            if (name.includes('pull')) return 'ph-arrows-in-line-vertical';
            if (name.includes('row')) return 'ph-boat';
            return 'ph-target';
        };

        const App = () => {
            const [workoutData, setWorkoutData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : initialSeedData;
            });
            
            const [currentDay, setCurrentDay] = useState(() => {
                return DAYS[new Date().getDay()];
            });

            const scrollContainerRef = useRef(null);
            const activeDayRef = useRef(null);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(workoutData));
            }, [workoutData]);

            // Auto-scroll the day slider to center the active day
            useEffect(() => {
                if (activeDayRef.current && scrollContainerRef.current) {
                    activeDayRef.current.scrollIntoView({ 
                        behavior: 'smooth', 
                        inline: 'center', 
                        block: 'nearest' 
                    });
                }
            }, [currentDay]);

            const dayData = workoutData[currentDay];

            // Dynamically recalculate progress whenever workoutData for currentDay changes
            const progress = useMemo(() => {
                if (dayData.isRest) return { completed: 0, total: 0, percent: 100 };
                
                let total = 0;
                let completed = 0;
                
                dayData.groups.forEach(group => {
                    group.exercises.forEach(ex => {
                        total += ex.sets.length;
                        completed += ex.sets.filter(s => s).length;
                    });
                });

                return {
                    completed,
                    total,
                    percent: total === 0 ? 0 : Math.round((completed / total) * 100)
                };
            }, [workoutData, currentDay]); // Correct dependencies to trigger updates

            const handleUpdateMetric = (gIndex, eIndex, field, value) => {
                const newData = { ...workoutData };
                newData[currentDay].groups[gIndex].exercises[eIndex][field] = value;
                setWorkoutData(newData);
            };

            const handleToggleSet = (gIndex, eIndex, sIndex) => {
                const newData = { ...workoutData };
                const current = newData[currentDay].groups[gIndex].exercises[eIndex].sets[sIndex];
                newData[currentDay].groups[gIndex].exercises[eIndex].sets[sIndex] = !current;
                setWorkoutData(newData);
            };

            return (
                <div className="relative min-h-screen pb-24">
                    {/* Ambient Glow Orbs */}
                    <div className="ambient-orb bg-brand-500 w-96 h-96 top-[-10%] left-[-10%]"></div>
                    <div className="ambient-orb bg-brand-400 w-80 h-80 bottom-[20%] right-[-10%] opacity-20" style={{animationDelay: '2s'}}></div>

                    {/* Header */}
                    <header className="px-6 pt-12 pb-6 flex justify-between items-center z-10 relative">
                        <div>
                            <p className="text-brand-500 font-bold tracking-widest text-xs uppercase mb-1 flex items-center gap-2">
                                <i className="ph-fill ph-fire text-lg"></i> Protocol
                            </p>
                            <h1 className="text-4xl font-black tracking-tight">Focus <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-brand-500">Today</span></h1>
                        </div>
                        
                        {/* Dynamic Circular Progress Ring */}
                        <div className="relative w-16 h-16 flex items-center justify-center glass-card rounded-full border border-white/5">
                            <svg className="w-14 h-14 transform -rotate-90">
                                <circle cx="28" cy="28" r="24" stroke="currentColor" strokeWidth="2" fill="transparent" className="text-surface-300" />
                                <circle cx="28" cy="28" r="24" stroke="currentColor" strokeWidth="2.5" fill="transparent" 
                                    className="text-brand-500 transition-all duration-700 ease-out drop-shadow-[0_0_8px_rgba(0,255,163,0.8)]"
                                    strokeDasharray={2 * Math.PI * 24}
                                    strokeDashoffset={2 * Math.PI * 24 - (progress.percent / 100) * (2 * Math.PI * 24)}
                                    strokeLinecap="round"
                                />
                            </svg>
                            <span className="absolute text-sm font-black">{progress.percent}%</span>
                        </div>
                    </header>

                    {/* Transparent Day Navigator with Auto-scroll */}
                    <nav className="mb-8 z-10 relative">
                        <div 
                            ref={scrollContainerRef}
                            className="flex overflow-x-auto no-scrollbar snap-x px-6 gap-6"
                        >
                            {DAYS.map(day => {
                                const isActive = day === currentDay;
                                return (
                                    <button 
                                        key={day}
                                        ref={isActive ? activeDayRef : null}
                                        onClick={() => setCurrentDay(day)}
                                        className={`snap-center shrink-0 pb-3 flex flex-col items-center justify-center transition-all duration-300 relative ${
                                            isActive 
                                            ? 'text-brand-500 font-bold scale-110' 
                                            : 'text-white/30 hover:text-white/60 font-medium'
                                        }`}
                                    >
                                        <span className="text-sm tracking-widest uppercase">{day.substring(0, 3)}</span>
                                        {isActive && (
                                            <div className="absolute bottom-0 w-1.5 h-1.5 rounded-full bg-brand-500 shadow-[0_0_8px_#00FFA3]"></div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                        <div className="h-[1px] w-full bg-gradient-to-r from-transparent via-white/10 to-transparent mt-[-1px]"></div>
                    </nav>

                    {}
                    <main className="px-6 space-y-8 z-10 relative">
                        {dayData.isRest ? (
                            <div className="glass-card rounded-[2rem] p-10 text-center flex flex-col items-center justify-center h-72 border-brand-400/10">
                                <div className="w-20 h-20 rounded-full bg-brand-500/5 flex items-center justify-center mb-6">
                                    <i className="ph-fill ph-battery-charging text-4xl text-brand-500"></i>
                                </div>
                                <h2 className="text-2xl font-bold mb-3 tracking-wide">System Recovery</h2>
                                <p className="text-white/40 text-sm leading-relaxed">Muscle synthesis active.<br/>Optimize hydration and sleep.</p>
                            </div>
                        ) : (
                            dayData.groups.map((group, gIndex) => {
                                const isGroupCompleted = group.exercises.every(ex => ex.sets.every(s => s));
                                const muscleIconClass = getMuscleIcon(group.name);

                                return (
                                    <div key={gIndex} className="relative fade-in">
                                        <div className="flex items-center gap-3 mb-4 pl-2">
                                            <i className={`ph-fill ${muscleIconClass} text-xl ${isGroupCompleted ? 'text-brand-500' : 'text-white/50'}`}></i>
                                            <h3 className={`text-lg font-black tracking-widest uppercase ${isGroupCompleted ? 'text-brand-500' : 'text-white/90'}`}>{group.name}</h3>
                                            <div className="h-[1px] bg-gradient-to-r from-surface-300 to-transparent flex-grow ml-2"></div>
                                        </div>
                                        
                                        <div className={`glass-card rounded-[2rem] p-5 sm:p-6 transition-all duration-500 relative overflow-hidden ${isGroupCompleted ? 'glow-completed' : ''}`}>
                                            
                                            {isGroupCompleted && (
                                                <div className="absolute -right-16 -top-16 w-40 h-40 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                            )}
                                            
                                            {isGroupCompleted && (
                                                <div className="absolute top-5 right-5 text-brand-500 flex items-center gap-1.5 z-10 opacity-80">
                                                    <i className="ph-bold ph-check-circle text-xl"></i>
                                                </div>
                                            )}

                                            <div className="space-y-6">
                                                {group.exercises.map((ex, eIndex) => {
                                                    const isExCompleted = ex.sets.every(s => s);
                                                    const exIconClass = getExerciseIcon(ex.name);

                                                    return (
                                                        <div key={eIndex} className={`relative transition-all duration-500 ${isExCompleted ? 'opacity-60 grayscale-[30%]' : ''}`}>
                                                            
                                                            <div className="flex items-center gap-3 mb-3">
                                                                {/* Flex-shrink-0 fixes mobile squishing */}
                                                                <div className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center border transition-all ${isExCompleted ? 'bg-brand-500/20 border-brand-500 text-brand-400' : 'border-white/10 text-white/60 bg-white/5'}`}>
                                                                    <i className={`text-xl ${isExCompleted ? 'ph-bold ph-check' : `ph-fill ${exIconClass}`}`}></i>
                                                                </div>
                                                                <h4 className={`text-base sm:text-lg font-bold leading-tight transition-all ${isExCompleted ? 'exercise-done-text text-brand-500' : 'text-white'}`}>
                                                                    {ex.name}
                                                                </h4>
                                                            </div>
                                                            
                                                            <div className="pl-13 sm:pl-14">
                                                                <div className="grid grid-cols-2 gap-3 mb-4">
                                                                    <div className="input-glass border border-white/5 rounded-xl p-2.5 focus-within:border-brand-500/50 focus-within:bg-brand-500/5 transition-all">
                                                                        <label className="block text-[10px] text-white/30 font-bold uppercase tracking-wider mb-0.5">Weight (lb)</label>
                                                                        <input type="text" value={ex.weight} 
                                                                            onChange={(e) => handleUpdateMetric(gIndex, eIndex, 'weight', e.target.value)}
                                                                            className="w-full bg-transparent text-brand-400 font-black text-xl sm:text-2xl outline-none" />
                                                                    </div>
                                                                    <div className="input-glass border border-white/5 rounded-xl p-2.5 focus-within:border-brand-500/50 focus-within:bg-brand-500/5 transition-all">
                                                                        <label className="block text-[10px] text-white/30 font-bold uppercase tracking-wider mb-0.5">Reps</label>
                                                                        <input type="text" value={ex.reps} 
                                                                            onChange={(e) => handleUpdateMetric(gIndex, eIndex, 'reps', e.target.value)}
                                                                            className="w-full bg-transparent text-white/90 font-black text-xl sm:text-2xl outline-none" />
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center gap-2.5 sm:gap-4 overflow-x-auto no-scrollbar pb-1">
                                                                    {ex.sets.map((isDone, sIndex) => (
                                                                        <button 
                                                                            key={sIndex}
                                                                            onClick={() => handleToggleSet(gIndex, eIndex, sIndex)}
                                                                            className={`w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-full flex items-center justify-center font-bold text-base sm:text-lg transition-all duration-300 border-2 ${
                                                                                isDone 
                                                                                ? 'bg-brand-500 border-brand-500 text-app shadow-[0_0_20px_rgba(0,255,163,0.4)] scale-105' 
                                                                                : 'border-white/10 text-white/40 bg-surface-100 hover:border-brand-500/50 hover:text-brand-500'
                                                                            }`}
                                                                        >
                                                                            {isDone ? <i className="ph-bold ph-check"></i> : (sIndex + 1)}
                                                                        </button>
                                                                    ))}
                                                                    <div className="ml-auto text-[10px] sm:text-xs text-white/20 font-bold uppercase tracking-widest pl-2">
                                                                        Sets
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
