<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17231e">
  <meta name="description" content="A simple offline workout log with per-set tracking, rest timers, and weekly progress.">
  <title>Gym Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f2;
      --paper: #ffffff;
      --ink: #17231e;
      --muted: #6a776f;
      --line: #e0e7e0;
      --green: #2f6b4f;
      --green-dark: #204b37;
      --green-soft: #e7f1e9;
      --lime: #d9f078;
      --amber: #c27b28;
      --shadow: 0 9px 26px rgba(24, 43, 32, .055);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #95be9d; outline-offset: 2px; }
    .app-shell { width: min(100%, 760px); margin: 0 auto; padding: 18px 16px 28px; }
    .app-header { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
    .brand-mark { width: 43px; height: 43px; flex: 0 0 43px; display: grid; place-items: center; background: var(--ink); color: var(--lime); border-radius: 15px; box-shadow: var(--shadow); }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-copy { min-width: 0; }
    .eyebrow { margin: 0 0 2px; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; font-size: 9px; color: var(--muted); }
    h1 { margin: 0; font-size: 23px; letter-spacing: -.045em; line-height: 1; }
    .offline-pill { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; background: var(--paper); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 9px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .offline-dot { width: 6px; height: 6px; background: #5f986d; border-radius: 50%; }
    .page { animation: page-in .18s ease-out; }
    @keyframes page-in { from { opacity: .65; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin: 25px 2px 12px; }
    .section-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .section-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .text-link { padding: 4px 0; border: 0; background: transparent; color: var(--green); font-weight: 800; font-size: 12px; }
    .week-overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .stat-card { padding: 14px 13px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 14px rgba(24,43,32,.025); min-width: 0; }
    .stat-label { color: var(--muted); font-size: 10px; line-height: 1.3; font-weight: 750; }
    .stat-value { font-size: 24px; letter-spacing: -.05em; line-height: 1.2; font-weight: 850; margin: 7px 0 2px; }
    .stat-foot { color: var(--muted); font-size: 10px; }
    .session-hero { position: relative; overflow: hidden; color: #fff; background: var(--ink); border-radius: 23px; padding: 22px 20px 18px; box-shadow: var(--shadow); }
    .session-hero::after { content: ""; width: 170px; height: 170px; border-radius: 50%; position: absolute; right: -75px; top: -89px; background: rgba(217,240,120,.10); border: 1px solid rgba(217,240,120,.25); }
    .hero-kicker { margin: 0 0 7px; color: var(--lime); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 850; }
    .session-hero h2 { margin: 0; font-size: clamp(26px, 7vw, 35px); letter-spacing: -.06em; line-height: 1.05; }
    .hero-sub { margin: 8px 0 17px; color: #c5d1c9; font-size: 12px; }
    .hero-progress-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #d6e1d9; font-size: 11px; margin-bottom: 7px; }
    .hero-progress-row strong { color: white; font-size: 12px; }
    .progress-track { width: 100%; height: 6px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.17); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--lime); transition: width .2s ease; }
    .exercise-list { display: grid; gap: 12px; }
    .exercise-card { padding: 15px 14px 13px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 3px 12px rgba(24,43,32,.025); }
    .exercise-top { display: flex; align-items: flex-start; gap: 9px; justify-content: space-between; }
    .exercise-title-wrap { min-width: 0; }
    .exercise-card h3 { margin: 0; font-size: 14px; line-height: 1.35; letter-spacing: -.025em; }
    .target-muscle { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .muscle-pill { flex: 0 0 auto; max-width: 100px; background: var(--green-soft); color: var(--green-dark); font-size: 9px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; border-radius: 8px; padding: 6px 7px; }
    .prescription-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin: 12px 0 9px; }
    .prescription { font-size: 11px; font-weight: 800; color: #34443a; }
    .rest-button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: #f7f9f6; color: #4d5e53; border-radius: 9px; padding: 6px 8px; font-weight: 750; font-size: 10px; }
    .rest-button svg { width: 12px; height: 12px; }
    .last-performance { margin: 0 0 10px; min-height: 14px; font-size: 10px; color: var(--muted); }
    .sets-header, .set-row { display: grid; grid-template-columns: 25px 26px minmax(0, 1fr) minmax(0, .83fr) 47px; gap: 7px; align-items: center; }
    .sets-header { padding: 0 3px 5px; color: #829087; text-transform: uppercase; letter-spacing: .07em; font-size: 9px; font-weight: 850; }
    .set-row { min-height: 43px; padding: 5px 3px; border-top: 1px solid #eef1ed; }
    .set-row.is-done { background: #f3f8f1; border-radius: 9px; border-top-color: transparent; }
    .set-check { width: 23px; height: 23px; accent-color: var(--green); justify-self: center; cursor: pointer; }
    .set-number { color: #6e7b72; font-size: 11px; font-weight: 750; }
    .field-wrap { min-width: 0; }
    .set-input, .rir-select { width: 100%; min-width: 0; height: 31px; background: #fbfcfa; color: var(--ink); border: 1px solid #dfe6de; border-radius: 8px; padding: 0 7px; font-size: 12px; font-weight: 700; }
    .set-input::placeholder { color: #a0aaa2; font-size: 10px; font-weight: 600; }
    .rir-select { padding: 0 4px; font-size: 11px; }
    .exercise-footer { display: flex; justify-content: flex-end; padding-top: 8px; }
    .small-action { border: 0; background: transparent; padding: 3px 0; color: var(--green); font-size: 10px; font-weight: 800; }
    .note { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 10px 2px 0; }
    .rest-day { text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 30px 21px; }
    .rest-icon { width: 57px; height: 57px; display: grid; place-items: center; border-radius: 19px; color: var(--green); background: var(--green-soft); margin: 0 auto 15px; }
    .rest-icon svg { width: 28px; height: 28px; }
    .rest-day h2 { margin: 0; font-size: 25px; letter-spacing: -.05em; }
    .rest-day p { color: var(--muted); line-height: 1.5; font-size: 12px; max-width: 300px; margin: 9px auto 17px; }
    .next-card { text-align: left; background: #f7faf6; border: 1px solid var(--line); border-radius: 14px; padding: 13px; }
    .next-card small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; font-weight: 850; }
    .next-card strong { display: block; margin: 4px 0 3px; font-size: 15px; }
    .next-card span { color: var(--muted); font-size: 11px; }
    .primary-button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; border-radius: 12px; background: var(--green); color: white; min-height: 42px; padding: 0 16px; font-size: 12px; font-weight: 800; }
    .primary-button:hover { background: var(--green-dark); }
    .secondary-button { display: inline-flex; justify-content: center; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); color: var(--ink); min-height: 39px; padding: 0 13px; font-size: 11px; font-weight: 800; }
    .section-intro { margin: -2px 2px 17px; color: var(--muted); line-height: 1.5; font-size: 12px; }
    .plan-groups { display: grid; gap: 12px; }
    .plan-group { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .plan-group summary { display: flex; justify-content: space-between; align-items: center; list-style: none; cursor: pointer; padding: 15px; gap: 10px; }
    .plan-group summary::-webkit-details-marker { display: none; }
    .plan-day { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .09em; font-weight: 850; margin-bottom: 4px; }
    .plan-group summary strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .plan-group summary small { display: block; margin-top: 3px; font-size: 10px; color: var(--muted); }
    .summary-chevron { color: var(--muted); width: 16px; height: 16px; flex: 0 0 auto; transition: transform .15s; }
    details[open] .summary-chevron { transform: rotate(180deg); }
    .plan-table { padding: 0 15px 15px; }
    .plan-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid #edf0ec; align-items: start; }
    .plan-line strong { display: block; font-size: 11px; line-height: 1.35; }
    .plan-line small { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; margin-top: 3px; }
    .plan-dose { white-space: nowrap; text-align: right; color: var(--green-dark); font-weight: 800; font-size: 10px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: 0 3px 12px rgba(24,43,32,.025); }
    .panel h3 { margin: 0; font-size: 14px; }
    .select-label { display: block; margin: 15px 0 6px; color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; }
    .wide-select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 11px; padding: 0 11px; background: #fbfcfa; color: var(--ink); font-weight: 700; font-size: 12px; }
    .trend-wrap { margin-top: 16px; padding: 10px 8px 4px; background: #f7faf6; border-radius: 13px; border: 1px solid #edf1eb; }
    .trend-title { display: flex; justify-content: space-between; align-items: center; margin: 2px 3px 4px; color: var(--muted); font-size: 10px; font-weight: 750; }
    .trend-title strong { color: var(--ink); font-size: 11px; }
    .trend-chart { width: 100%; display: block; height: 150px; overflow: visible; }
    .empty-state { padding: 25px 18px; text-align: center; background: #f8faf7; border: 1px dashed #d8e1d7; border-radius: 13px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .entries { display: grid; gap: 9px; margin-top: 12px; }
    .entry-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid #edf0ec; }
    .entry-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .entry-date { font-size: 11px; font-weight: 850; }
    .entry-detail { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .entry-result { text-align: right; font-size: 12px; font-weight: 850; white-space: nowrap; }
    .entry-result small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 650; }
    .history-list { display: grid; gap: 11px; }
    .history-card { background: var(--paper); border: 1px solid var(--line); border-radius: 15px; padding: 14px; }
    .history-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .history-head h3 { margin: 0; font-size: 13px; }
    .history-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .history-badge { background: var(--green-soft); color: var(--green-dark); border-radius: 7px; padding: 5px 7px; font-size: 9px; font-weight: 850; white-space: nowrap; }
    .history-badge.in-progress { background: #f7eedf; color: #865415; }
    .history-progress { display: flex; justify-content: space-between; gap: 10px; margin: 12px 0 6px; color: var(--muted); font-size: 10px; }
    .history-track { height: 5px; background: #edf1eb; border-radius: 99px; overflow: hidden; }
    .history-track span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .history-exercises { margin-top: 10px; display: grid; gap: 6px; }
    .history-exercise { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; line-height: 1.4; }
    .history-exercise span:first-child { color: var(--muted); }
    .history-exercise strong { text-align: right; }
    .timer-dock { position: fixed; z-index: 20; bottom: calc(77px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(calc(100% - 24px), 520px); background: #17231e; color: white; border-radius: 15px; padding: 11px 12px; box-shadow: 0 14px 34px rgba(11,24,16,.25); display: flex; align-items: center; gap: 10px; }
    .timer-dock[hidden] { display: none; }
    .timer-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 34px; border-radius: 11px; color: var(--lime); background: rgba(217,240,120,.12); }
    .timer-icon svg { width: 18px; height: 18px; }
    .timer-main { min-width: 0; flex: 1; }
    .timer-label { color: #c5d1c9; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; font-weight: 850; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .timer-value { font-size: 21px; line-height: 1.15; font-weight: 850; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .timer-controls { display: flex; gap: 5px; align-items: center; }
    .timer-controls button { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: white; border-radius: 8px; min-width: 34px; height: 32px; padding: 0 8px; font-size: 10px; font-weight: 800; }
    .timer-controls .timer-dismiss { color: var(--ink); background: var(--lime); border-color: var(--lime); }
    .bottom-nav { position: fixed; z-index: 15; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.95); border-top: 1px solid var(--line); backdrop-filter: blur(16px); }
    .nav-inner { width: min(100%, 530px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .nav-button { border: 0; background: transparent; color: #849087; min-height: 51px; padding: 5px 2px 3px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; border-radius: 12px; font-size: 9px; font-weight: 800; }
    .nav-button svg { width: 19px; height: 19px; stroke-width: 1.9; }
    .nav-button.active { color: var(--green-dark); background: var(--green-soft); }
    .save-status { color: var(--muted); font-size: 10px; text-align: center; margin: 20px 0 3px; }
    .toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 40; background: var(--ink); color: white; border-radius: 99px; padding: 10px 15px; font-size: 11px; font-weight: 750; box-shadow: var(--shadow); transition: opacity .15s, transform .15s; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .footer-note { color: #8a958d; font-size: 10px; line-height: 1.5; text-align: center; margin: 22px 10px 0; }
    @media (min-width: 600px) {
      .app-shell { padding: 27px 24px 32px; }
      .app-header { margin-bottom: 28px; }
      .exercise-list { grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; }
      .exercise-card { height: 100%; }
      .session-hero { padding: 25px; }
      .week-overview { gap: 12px; }
      .stat-card { padding: 17px; }
      .timer-dock { bottom: 88px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8v8M7 5v14M17 5v14M20 8v8M7 12h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-copy"><p class="eyebrow">Your training log</p><h1>GymWorkoutTracker</h1></div>
      <div class="offline-pill"><span class="offline-dot"></span><span id="connectionLabel">Local save on</span></div>
    </header>

    <main id="mainView" class="page" aria-live="polite"></main>
    <p class="footer-note">Your workout data stays on this device. Export a backup regularly if you switch phones or clear browser data.</p>
  </div>

  <section class="timer-dock" id="timerDock" hidden aria-live="polite">
    <div class="timer-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 9v4l2.7 1.8M9 2h6M12 2v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <div class="timer-main"><div class="timer-label" id="timerLabel">Rest timer</div><div class="timer-value" id="timerValue">02:00</div></div>
    <div class="timer-controls" id="timerControls"></div>
  </section>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <button class="nav-button active" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10.7 12 3l9 7.7M5.5 9.5V21h13V9.5M9.5 21v-7h5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Today</span></button>
      <button class="nav-button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Plan</span></button>

      <button class="nav-button" data-tab="history"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2M4 4l3 1-1 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>History</span></button>
    </div>
  </nav>
  <div class="toast" id="toast" role="status"></div>

<script>
(() => {

      const entries=historyForExercise(selected.workout.id,selected.ex.id);
      const last=entries[entries.length-1];
      html+=`<div style="margin-top:16px"><div style="font-size:12px;font-weight:850">${esc(selected.ex.name)}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">Target: ${esc(selected.ex.target)} · ${selected.ex.sets} sets × ${selected.ex.min}–${selected.ex.max} reps</div></div>`;
      if(last) {
        const best=topWeight(last.sets,!!selected.ex.assistance); const reps=totalReps(last.sets); const checked=last.sets.filter(x=>x.done).length;
        html+=`<div class="week-overview" style="margin-top:13px;grid-template-columns:repeat(3,minmax(0,1fr))">${renderStat('LATEST LOG',formatDate(last.session.date,{month:'short',day:'numeric'}),'last session')}${renderStat(selected.ex.assistance?'ASSISTANCE':'TOP WEIGHT',best===null?'—':best, best===null?'no weight logged':(selected.ex.assistance?'less is harder':store.unit))}${renderStat('TOTAL REPS',reps,`${checked}/${last.sets.length} sets checked`)}</div>`;
      }
      html+=`<div style="margin-top:15px">${entries.length?renderTrend(entries,!!selected.ex.assistance):'<div class="empty-state">No logged sets for this exercise yet. Start a workout and enter your actual weight and reps; your history will appear here automatically.</div>'}</div>`;
      if(entries.length) html+=`<div class="entries">${entries.slice().reverse().map(({session,sets})=>`<div class="entry-row"><div><div class="entry-date">${esc(formatLongDate(session.date))}</div><div class="entry-detail">${esc(setDisplay(sets))}</div><div class="entry-detail">${sets.filter(s=>s.done).length}/${sets.length} sets checked${sets.some(s=>s.rir!=='')?' · RIR '+sets.filter(s=>s.rir!=='').map(s=>s.rir).join('/') : ''}</div></div><div class="entry-result">${topWeight(sets,!!selected.ex.assistance)===null?'—':`${topWeight(sets,!!selected.ex.assistance)} ${store.unit}`}<small>${totalReps(sets)} total reps</small></div></div>`).join('')}</div>`;
    }
    html+=`</section><p class="note">A logged top weight is only one data point. Compare reps, RIR, technique, and machine settings too. For assisted pull-ups, reducing the assistance amount is progress.</p>`;
    return html;
  }
  function renderHistory() {
    const items=Object.values(store.sessions).filter(s=>{const w=workoutById(s.workoutId);return w&&hasAnyData(s,w)}).sort((a,b)=>b.date.localeCompare(a.date));
    let html=`<div class="section-heading" style="margin-top:0"><div><h2>Workout history</h2><p>Your completed and in-progress sessions.</p></div><button class="text-link" data-action="export-csv">Export CSV ↓</button></div>`;
    if(!items.length) return html+`<div class="empty-state">Your training history will appear here when you log your first set. Your entries are saved automatically on this device.</div>`;
    html+=`<div class="history-list">${items.map(session=>{
      const w=workoutById(session.workoutId); const p=progressFor(session,w); const complete=isWorkoutComplete(session,w); const pct=Math.round(100*p.done/p.total);
      const loggedExercises=w.exercises.map(ex=>({ex,sets:session.sets[ex.id]||[]})).filter(x=>x.sets.some(set=>isSetLogged(set)));
      return `<article class="history-card"><div class="history-head"><div><h3>${esc(w.title)}</h3><p>${esc(formatLongDate(session.date))}</p></div><span class="history-badge ${complete?'':'in-progress'}">${complete?'Completed':'In progress'}</span></div><div class="history-progress"><span>${p.done}/${p.total} sets checked</span><strong>${pct}%</strong></div><div class="history-track"><span style="width:${pct}%"></span></div><div class="history-exercises">${loggedExercises.map(({ex,sets})=>`<div class="history-exercise"><span>${esc(ex.name)}</span><strong>${sets.filter(s=>isSetLogged(s)).length}/${sets.length} logged · ${totalReps(sets)} reps</strong></div>`).join('')}</div></article>`;
    }).join('')}</div><div style="display:flex;justify-content:center;margin-top:15px"><button class="secondary-button" data-action="export-csv">Export all sessions (CSV)</button></div>`;
    return html;
  }
  function renderTimer() {
    const dock=$('#timerDock'); const t=store.timer;
    if(!t) { dock.hidden=true; return; }
    dock.hidden=false;
    $('#timerLabel').textContent=t.label || 'Rest timer';
    $('#timerValue').textContent=formatRemaining(remainingMs(t));
    if(t.paused && t.remainingMs<=0) {
      $('#timerLabel').textContent='Rest complete';
      $('#timerControls').innerHTML='<button class="timer-dismiss" data-action="timer-dismiss">Done</button>';
    } else if(t.paused) {
      $('#timerControls').innerHTML='<button data-action="timer-resume">Resume</button><button data-action="timer-reset">Reset</button>';
    } else {
      $('#timerControls').innerHTML='<button data-action="timer-pause">Pause</button><button data-action="timer-reset">Reset</button>';
    }
  }
  function remainingMs(t) { if(!t) return 0; return t.paused ? Math.max(0,t.remainingMs||0) : Math.max(0,(t.endAt||Date.now())-Date.now()); }
  function formatRemaining(ms) { const sec=Math.max(0,Math.ceil(ms/1000)); return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; }
  function startTimer(seconds,label='Rest timer') {
    const duration=Math.max(1,Number(seconds)||120)*1000;
    store.timer={durationMs:duration,endAt:Date.now()+duration,remainingMs:duration,paused:false,label}; saveStore(); renderTimer();
  }
  function pauseTimer() { if(!store.timer || store.timer.paused)return; store.timer.remainingMs=remainingMs(store.timer); store.timer.paused=true; store.timer.endAt=null; saveStore(); renderTimer(); }
  function resumeTimer() { if(!store.timer || !store.timer.paused || store.timer.remainingMs<=0)return; store.timer.paused=false; store.timer.endAt=Date.now()+store.timer.remainingMs; saveStore(); renderTimer(); }
  function resetTimer() { if(!store.timer)return; store.timer.remainingMs=store.timer.durationMs; store.timer.endAt=Date.now()+store.timer.durationMs; store.timer.paused=false; saveStore(); renderTimer(); }
  function tickTimer() {
    if(!store.timer || store.timer.paused) return;
    const left=remainingMs(store.timer);
    $('#timerValue').textContent=formatRemaining(left);
    if(left<=0) {
      store.timer.remainingMs=0; store.timer.endAt=null; store.timer.paused=true; saveStore(); renderTimer();
      try { if('vibrate' in navigator) navigator.vibrate([100,60,100]); } catch(_) {}
      return;
    }
  }
  function showToast(message) {
    const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimeout); toastTimeout=setTimeout(()=>el.classList.remove('show'),1900);
  }
  function render() {
    const main=$('#mainView');
    if(activeTab==='today') main.innerHTML=renderToday();
    else if(activeTab==='plan') main.innerHTML=renderPlan();
    else if(activeTab==='progress') main.innerHTML=renderProgress();
    else main.innerHTML=renderHistory();
    $$('.nav-button').forEach(btn=>{const isActive=btn.dataset.tab===activeTab;btn.classList.toggle('active',isActive);if(isActive)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current');});
    renderTimer();
  }
  function setActiveTab(tab) { if(!['today','plan','progress','history'].includes(tab)) return; activeTab=tab; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function getSessionFromDataset(el) {
    const workout=workoutById(el.dataset.workout); if(!workout)return null;
    return {workout,session:getSession(el.dataset.date,workout)};
  }
  function updateSetField(el) {
    const {workout,session}=getSessionFromDataset(el); if(!workout||!session)return;
    const index=Number(el.dataset.index); const exerciseId=el.dataset.exercise; const field=el.dataset.field;
    if(!session.sets[exerciseId] || !session.sets[exerciseId][index])return;
    session.sets[exerciseId][index][field]=el.value;
    session.updatedAt=Date.now(); saveStore();
  }
  function toggleSet(el) {
    const {workout,session}=getSessionFromDataset(el); if(!workout||!session)return;
    const index=Number(el.dataset.index); const exerciseId=el.dataset.exercise; if(!session.sets[exerciseId]||!session.sets[exerciseId][index])return;
    const set=session.sets[exerciseId][index]; set.done=el.checked; session.updatedAt=Date.now(); saveStore();
    if(el.checked) {
      const rows=getSetRows(session,workout);
      if(!rows.every(r=>r.set.done)) {
        const ex=workout.exercises.find(x=>x.id===exerciseId);
        startTimer(ex?.rest || 120, `${ex?.name || 'Set'} · rest`);
      }
    }
    render();
  }
  function clearExercise(el) {
    const {workout,session}=getSessionFromDataset(el); if(!workout||!session)return;
    const exerciseId=el.dataset.exercise; const ex=workout.exercises.find(x=>x.id===exerciseId); if(!ex)return;
    session.sets[exerciseId]=Array.from({length:ex.sets},()=>({weight:'',reps:'',rir:'',done:false})); session.updatedAt=Date.now(); saveStore(); render(); showToast('Exercise sets cleared');
  }
  function exportCsv() {
    const lines=[['Date','Workout','Day','Exercise','Set','Target reps','Weight','Unit','Reps','RIR','Checked']];
    Object.values(store.sessions).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
      const w=workoutById(s.workoutId); if(!w)return;
      w.exercises.forEach(ex=>(s.sets[ex.id]||[]).forEach((set,i)=>{
        if(!isSetLogged(set))return;
        lines.push([s.date,w.title,w.dayName,ex.name,i+1,`${ex.min}-${ex.max}`,set.weight,store.unit,set.reps,set.rir,set.done?'yes':'no']);
      }));
    });
    const csv=lines.map(row=>row.map(value=>`"${String(value??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`GymWorkoutTracker-workouts-${dateKey()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('CSV export created');
  }
  document.addEventListener('click', event => {
    const tabButton=event.target.closest('[data-tab]');
    if(tabButton) { setActiveTab(tabButton.dataset.tab); return; }
    const actionEl=event.target.closest('[data-action]'); if(!actionEl)return;
    const action=actionEl.dataset.action;
    if(action==='go-tab') setActiveTab(actionEl.dataset.tab);
    else if(action==='start-rest') startTimer(Number(actionEl.dataset.seconds), `${actionEl.dataset.label} · rest`);
    else if(action==='toggle-set') { /* handled by the checkbox change event */ }
    else if(action==='clear-exercise') clearExercise(actionEl);
    else if(action==='timer-pause') pauseTimer();
    else if(action==='timer-resume') resumeTimer();
    else if(action==='timer-reset') resetTimer();
    else if(action==='timer-dismiss') { store.timer=null; saveStore(); renderTimer(); }
    else if(action==='export-csv') exportCsv();
  });
  document.addEventListener('input', event=>{const el=event.target.closest('[data-action="set-field"]');if(el)updateSetField(el);});
  document.addEventListener('change', event=>{
    const el=event.target.closest('[data-action="set-field"]'); if(el) updateSetField(el);
    if(event.target.id==='progressSelect') { selectedProgress=event.target.value; render(); }
  });
  document.addEventListener('change', event=>{const el=event.target.closest('[data-action="toggle-set"]'); if(el)toggleSet(el);});
  window.addEventListener('online',()=>{$('#connectionLabel').textContent='Saved on device';});
  window.addEventListener('offline',()=>{$('#connectionLabel').textContent='Offline · local save';});
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  if(store.timer && !store.timer.paused && remainingMs(store.timer)<=0) { store.timer.remainingMs=0; store.timer.endAt=null; store.timer.paused=true; saveStore(); }
  render(); timerInterval=setInterval(tickTimer,1000);
})();
</script>
</body>
</html>
